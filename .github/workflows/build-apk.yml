name: Build Android APK

on:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Install Android NDK 28.2.13676358
        run: |
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk
          rm -rf /usr/local/lib/android/sdk/ndk/*
          yes "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          ls -la /usr/local/lib/android/sdk/ndk/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android SDK & Gradle Repositories
        run: |
          flutter config --android-sdk $ANDROID_HOME
          yes "y" | flutter doctor --android-licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> android/local.properties

          # 注入全局 Gradle 仓库配置，使 Flutter 内置插件也能直接从 Maven Central 下载 Kotlin 依赖
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/repositories.init.gradle
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              project.repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Build APK
        run: |
          python3 scripts/build_android.py --abi arm64-v8a --all-sources

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-apk
          path: dist/android/*.apk
