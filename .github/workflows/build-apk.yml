name: Build Android APK

on:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android SDK & Licenses
        run: |
          flutter config --android-sdk /usr/local/lib/android/sdk
          yes "y" | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          python3 scripts/build_android.py --abi arm64-v8a --all-sources

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-apk
          path: dist/android/*.apk
