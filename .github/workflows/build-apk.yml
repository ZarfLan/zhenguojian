name: Build Android APK

on:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Install Android NDK 28.2.13676358
        run: |
          yes "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android SDK
        run: |
          flutter config --android-sdk $ANDROID_HOME
          yes "y" | flutter doctor --android-licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK
        run: |
          python3 scripts/build_android.py --abi arm64-v8a --all-sources

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-apk
          path: dist/android/*.apk
