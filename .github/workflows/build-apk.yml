name: Build Android APK (32-bit & 64-bit)

on:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Install Android NDK 28.2.13676358
        run: |
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk
          rm -rf /usr/local/lib/android/sdk/ndk/*
          yes "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          ls -la /usr/local/lib/android/sdk/ndk/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android SDK
        run: |
          flutter config --android-sdk $ANDROID_HOME
          yes "y" | flutter doctor --android-licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> android/local.properties
          rm -rf ~/.gradle/init.d/*

      - name: Build APK (32-bit armeabi-v7a & 64-bit arm64-v8a)
        run: |
          # 同时编译 32 位和 64 位两个版本的 APK
          python3 scripts/build_android.py --abi armeabi-v7a --abi arm64-v8a --all-sources --cn-mirrors

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-apks
          path: dist/android/*.apk
